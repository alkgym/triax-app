<!doctype html>
<html lang="es" data-fs-app="triathlon" data-fs-shell="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GYM" />
    <title>GYM — Lopez in Motion</title>
  
  <!-- ════ SPATIAL OVERLAY (ecosistema) · sólo capa visual ════ -->
<style id="fs-spatial-overlay">
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');
:root{ --fs-font-sans:'Inter',ui-sans-serif,system-ui,sans-serif !important; --fs-font-display:'Sora',ui-sans-serif,system-ui,sans-serif !important; }
html{ background:#06060d !important; }
body{ background:transparent !important; }
/* guard global anti scroll horizontal (antes lo aportaba hub.css, ya retirado) */
html,body{ overflow-x:clip; }
body::before{ content:''; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(46vw 46vw at 8% -4%, rgba(255,87,34,.15), transparent 60%),
    radial-gradient(48vw 48vw at 100% 6%, rgba(124,92,255,.15), transparent 62%),
    radial-gradient(44vw 44vw at 58% 112%, rgba(255,176,136,.10), transparent 64%);
  animation: fsdrift 34s ease-in-out infinite alternate; }
body::after{ content:''; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);
  background-size:46px 46px; -webkit-mask-image:radial-gradient(ellipse 78% 56% at 50% 22%,#000,transparent 80%); mask-image:radial-gradient(ellipse 78% 56% at 50% 22%,#000,transparent 80%); }
@keyframes fsdrift{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(2vw,2vh,0) scale(1.08)}}
.card,.glass,.panel{ backdrop-filter:blur(16px) saturate(1.2) !important; -webkit-backdrop-filter:blur(16px) saturate(1.2) !important; }
/* ═══════════ PASE MÓVIL ═══════════ */
@media (max-width:900px){
  html,body{ overflow-x:clip !important; max-width:100vw !important; width:100% !important; }
  .header{ flex-wrap:wrap !important; row-gap:8px; }
  [class*="chart"]{ max-width:100% !important; }
  [class*="grid"]:not(button):not(a):not(.btn),[class*="flex"]:not(button):not(a):not(.btn){ min-width:0 !important; }
  .card:not(button):not(a),.glass:not(button):not(a),.panel:not(button):not(a){ min-width:0 !important; max-width:100% !important; }
  img,video,canvas,table{ max-width:100% !important; height:auto; }
  button,.btn,a.btn,[role="button"]{ min-height:44px !important; }
  input:not([type=checkbox]):not([type=radio]),select,textarea{ min-height:46px !important; font-size:16px !important; }
  textarea{ min-height:92px !important; }
  button:active,.btn:active,[role="button"]:active{ transform:scale(.97); }
  table{ display:block; overflow-x:auto; white-space:nowrap; -webkit-overflow-scrolling:touch; }
}
@media (prefers-reduced-motion:reduce){ body::before{ animation:none !important; } }
</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
